# Site settings (your existing values)
title:     "Muhammed's blog"
email:     ""
description: >- # this means “no newlines” until “baseurl:”
  
url:       "https://m6li.com" # the base hostname & protocol for your site

# If you're serving the blog at https://username.github.io/blog,
# leave baseurl empty and handle /blog in your permalink:
baseurl: ""
collections_dir: blog
# Theme (you can keep your existing theme, or switch to minima/custom)

# Where Jekyll looks for posts—by default it’s _posts at the root.
# If you want to keep your blog files in blog/_posts, add:
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Tell Jekyll to output those posts under /blog
permalink: /blog/:year/:month/:day/:title/

# Plugins you’re using for the blog
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-remote-theme
  - jekyll-paginate
  
remote_theme:  
  gwgundersen/blog-theme  

# number of posts per page
paginate: 5
# path for additional pages
paginate_path: "/blog/page:num/"


# Kramdown math settings
kramdown:
  input: GFM
  math_engine: katex

# jekyll-scholar bibliography
scholar:
  style: apa
  bibliography: bibliography.bib

# Optional: default layout for blog posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "Your Name"
